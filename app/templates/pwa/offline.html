<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Keine Verbindung – Zentriq</title>
  {# Bewusst eigenstaendig (Styles inline): wird vom Service Worker zwischengespeichert. #}
  <style>
    body { margin: 0; background: #eef1f5; color: #1b2330; font-family: "InterVariable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { display: flex; min-height: 100dvh; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 2rem 1rem; text-align: center; box-sizing: border-box; }
    .wordmark { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; color: #133a63; }
    h1 { margin: 0.5rem 0 0; font-size: 1.05rem; font-weight: 650; }
    p { max-width: 22rem; margin: 0; font-size: 0.9rem; line-height: 1.5; color: #5b6576; }
    button { margin-top: 0.5rem; border: 0; border-radius: 0.5rem; background: #1f5288; padding: 0.6rem 1.1rem; font: inherit; font-size: 0.875rem; font-weight: 600; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <span class="wordmark">Zentriq</span>
    <h1>Keine Verbindung</h1>
    <p>Zentriq benötigt eine Internetverbindung. Ihre Daten werden aus Datenschutzgründen nicht auf diesem Gerät gespeichert.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
