{# <details data-lazy-src="..."><summary>…</summary><div data-lazy-body></div></details>: Inhalt erst beim ersten Aufklappen laden. #}
<script>
  document.addEventListener("toggle", function (ev) {
    var d = ev.target;
    if (!d.matches || !d.matches("details[data-lazy-src]") || !d.open || d.dataset.loaded) return;
    d.dataset.loaded = "1";
    var body = d.querySelector("[data-lazy-body]");
    body.textContent = "Wird geladen …";
    fetch(d.dataset.lazySrc, { credentials: "same-origin", headers: { "X-Requested-With": "fetch" } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { body.innerHTML = html; })
      .catch(function () { body.textContent = "Konnte nicht geladen werden. Bitte die Seite neu laden."; delete d.dataset.loaded; });
  }, true);
</script>
