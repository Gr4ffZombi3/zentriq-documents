{% from "ui/icons.html" import icon %}

<div id="upload-widget" data-upload-widget>
  {% set selected_list_type = request.form.get('list_type', '') %}
  <form
    data-upload-form
    action="{{ url_for('upload.upload_document') }}"
    method="post"
    enctype="multipart/form-data"
    class="upload-dropzone upload-compact-shell"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="upload-compact">
      <h2 class="upload-compact-title">Liste hochladen</h2>
      <label class="filter-field">
        <span>Listentyp</span>
        <select id="upload-list-type" name="list_type" required>
          <option value="">Bitte auswählen</option>
          <option value="own" {{ 'selected' if selected_list_type == 'own' else '' }}>Eigene Leipziger Liste</option>
          <option value="gs" {{ 'selected' if selected_list_type == 'gs' else '' }}>GS-Liste</option>
          <option value="comparison" {{ 'selected' if selected_list_type == 'comparison' else '' }}>Vergleichsliste</option>
          <option value="other" {{ 'selected' if selected_list_type == 'other' else '' }}>Sonstige Leipziger Liste</option>
        </select>
      </label>
      <label for="file-input" class="upload-compact-drop" data-upload-label>
        <span class="upload-compact-icon" data-upload-icon>{{ icon('upload', class='h-4 w-4') }}</span>
        <span class="upload-compact-file" data-upload-filename>PDF auswählen oder hierher ziehen</span>
      </label>
      <input id="file-input" type="file" name="file" accept="application/pdf" class="sr-only" data-upload-input>
      <button type="submit" data-upload-submit class="btn-plain btn-plain-primary">Hochladen</button>
    </div>

    <div class="upload-runtime-panel hidden" data-upload-runtime aria-live="polite">
      <div class="upload-runtime-header">
        <p class="upload-runtime-stage" data-upload-stage>Bereit</p>
        <span class="upload-runtime-percent" data-upload-percent>0%</span>
      </div>
      <div class="upload-runtime-bar" aria-hidden="true">
        <span data-upload-progress-bar></span>
      </div>
      <p class="upload-runtime-copy" data-upload-copy></p>
    </div>
  </form>

  <p
    data-upload-error
    class="mt-2 {{ '' if error else 'hidden' }} flex items-center gap-2 text-sm text-error"
  >
    {{ icon('alert-circle', class='w-4 h-4') }}
    <span>{{ error or '' }}</span>
  </p>
</div>
